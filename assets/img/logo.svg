<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Dreamy Cookies">
  <defs>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5A2B"/>
      <stop offset="100%" style="stop-color:#5C3A1E"/>
    </linearGradient>
  </defs>
  <!-- Círculo externo -->
  <circle cx="100" cy="100" r="98" fill="#3d2314" stroke="#c4713b" stroke-width="4"/>
  <!-- Texto circular simplificado -->
  <text fill="#fff" font-size="8" font-family="Arial,sans-serif" letter-spacing="2">
    <textPath href="#circlePath" startOffset="5%">DREAMY COOKIES " DREAMY COOKIES "</textPath>
  </text>
  <path id="circlePath" fill="none" d="M 100,100 m -75,0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0"/>
  <!-- Fundo branco do cookie -->
  <circle cx="100" cy="95" r="52" fill="#fff"/>
  <!-- Cookie -->
  <circle cx="100" cy="95" r="45" fill="url(#cookieGrad)"/>
  <!-- Mordida -->
  <circle cx="130" cy="70" r="18" fill="#fff"/>
  <!-- Gotas de chocolate -->
  <circle cx="82" cy="82" r="5" fill="#3d2314"/>
  <circle cx="105" cy="78" r="4" fill="#3d2314"/>
  <circle cx="92" cy="100" r="5" fill="#3d2314"/>
  <circle cx="115" cy="98" r="4" fill="#3d2314"/>
  <circle cx="85" cy="112" r="4" fill="#3d2314"/>
  <!-- Lua -->
  <circle cx="78" cy="58" r="8" fill="#e8b84a"/>
  <circle cx="82" cy="56" r="7" fill="#fff"/>
  <!-- Estrelas -->
  <polygon points="95,48 96,51 99,51 97,53 98,56 95,54 92,56 93,53 91,51 94,51" fill="#e8b84a"/>
  <polygon points="118,52 119,54 121,54 119.5,55.5 120,58 118,56.5 116,58 116.5,55.5 115,54 117,54" fill="#e8b84a"/>
  <polygon points="108,42 108.5,43.5 110,43.5 109,44.5 109.5,46 108,45 106.5,46 107,44.5 106,43.5 107.5,43.5" fill="#fff"/>
  <!-- Nome -->
  <text x="100" y="168" text-anchor="middle" fill="#c4713b" font-family="Georgia,serif" font-size="11" font-weight="bold">DREAMY COOKIES</text>
</svg>
